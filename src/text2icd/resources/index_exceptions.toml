# Alphabetic Index references that do not resolve to a Tabular List code, reviewed by hand.
#
# Every code an Index term points to (code, manifestation, subcat, seecat, table cells) must exist
# in the release's Tabular List or billable set. The entries below are the known exceptions, each
# with the reason. Where the intended reading is clear, `code` and `manifestation` give it so that
# the graph builder can apply the correction. `text2icd data stats` fails on any new unresolved
# reference and on any entry here that is no longer observed.

schema = 1

[[exception]]
releases = ["fy2026", "fy2026-apr", "fy2027"]
book = "index"
path = "Osteitis > deformans > in > neoplastic disease > pubic ramus"
field = "manifestation"
value = "pubis] D49.2 [M90.68"
reason = "XML markup error. The printed Index reads 'pubic ramus [pubis] D49.2 [M90.68]'."
code = "D49.2"
manifestation = "M90.68"

