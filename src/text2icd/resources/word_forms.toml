# Adjectives of anatomy and the nouns the Alphabetic Index files their conditions under.
#
# The Index walk compares a phrase with Index titles word by word, and maps both sides through
# this table first. So "renal failure" meets `Failure, renal` and "kidney stone" meets
# `Calculus, kidney` alike, whichever of the two words the Index or the phrase uses.
#
# Written from medical knowledge. Keep an adjective out when it has more than one anatomical
# meaning (`cervical` is the neck and the cervix) or when it is also a condition word (`cystic`).
# A slow test checks that every noun is a word of the Index.

schema = 1

[adjectives]
abdominal = "abdomen"
anal = "anus"
aortic = "aorta"
arterial = "artery"
articular = "joint"
atrial = "atrium"
auricular = "ear"
biliary = "bile"
bronchial = "bronchus"
cardiac = "heart"
cerebellar = "cerebellum"
cerebral = "brain"
colonic = "colon"
conjunctival = "conjunctiva"
