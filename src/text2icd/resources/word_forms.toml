cranial = "skull"
cutaneous = "skin"
dental = "tooth"
dermal = "skin"
duodenal = "duodenum"
esophageal = "esophagus"
facial = "face"
femoral = "femur"
fibular = "fibula"
gastric = "stomach"
gingival = "gum"
hepatic = "liver"
humeral = "humerus"
ileal = "ileum"
