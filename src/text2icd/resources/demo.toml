  { phrase = "Bright's disease", codes = ["N05.9"] },
  { phrase = "cellulitis of left lower leg", codes = ["L03.116"] },
  { phrase = "pressure ulcer of sacral region, stage 3", codes = ["L89.153"] },
  { phrase = "senile dementia", codes = ["F03.90"] },
]

[[group]]
name = "Excludes1 and conditions one code covers"
examples = [
  { phrase = "constipation and fecal impaction", codes = ["K56.41"] },
  { phrase = "essential hypertension and hypertensive heart disease", codes = ["I11.9"] },
  { phrase = "type 2 diabetes and hyperglycemia", codes = ["E11.65"] },
