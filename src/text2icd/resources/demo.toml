# The GitHub Pages demo's phrases (task 10.13), written for the demo: no patient data.
#
# Each example lists the codes text2icd's deterministic coder (L1) gives it on `release`, in
# order; `outpatient` adds the outpatient setting and its codes. `text2icd demo export` fails
# when an example codes differently on this release, so a change that breaks one is caught
# (the integration job exports the demo). They are chosen to show the coder's features, not to
# measure it: docs/results.md does that.

release = "fy2027"

[[group]]
name = "Combination codes"
examples = [
  { phrase = "type 2 DM with diabetic CKD stage 3a", codes = ["E11.22", "N18.31"] },
  { phrase = "type 1 diabetes with hyperglycemia", codes = ["E10.65"] },
  { phrase = "type 2 diabetes with diabetic polyneuropathy", codes = ["E11.42"] },
  { phrase = "hypertension with CKD stage 3a", codes = ["I12.9", "N18.31"] },
  { phrase = "hypertensive heart and chronic kidney disease with heart failure and stage 4 CKD", codes = ["I13.0", "I50.9", "N18.4"] },
  { phrase = "COPD with acute exacerbation", codes = ["J44.1"] },
  { phrase = "alcoholic cirrhosis of liver with ascites", codes = ["K70.31"] },
  { phrase = "influenza with pneumonia", codes = ["J11.00"] },
  { phrase = "Crohn's disease of small intestine with intestinal obstruction", codes = ["K50.012"] },
]

[[group]]
name = "Etiology and manifestation"
examples = [
  { phrase = "amyloid heart disease", codes = ["E85.4", "I43"] },
  { phrase = "dementia in Parkinson's disease", codes = ["G20.A1", "F02.80"] },
  { phrase = "Alzheimer's disease with late onset", codes = ["G30.1", "F02.80"] },
  { phrase = "diabetic nephropathy", codes = ["E11.21"] },
]

[[group]]
name = "Injuries: the 7th character"
examples = [
  { phrase = "open fracture of shaft of right femur, subsequent encounter with delayed healing", codes = ["S72.301H"] },
  { phrase = "displaced fracture of left radial styloid process, initial encounter", codes = ["S52.512A"] },
  { phrase = "sprain of right ankle, initial encounter", codes = ["S93.401A"] },
  { phrase = "concussion without loss of consciousness, sequela", codes = ["S06.0X0S"] },
  { phrase = "laceration without foreign body of left hand, initial encounter", codes = ["S61.412A"] },
]

[[group]]
name = "The Table of Neoplasms"
