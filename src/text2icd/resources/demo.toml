  { phrase = "malignant neoplasm of right upper lobe of lung", codes = ["C34.11"] },
  { phrase = "secondary malignant neoplasm of liver", codes = ["C78.7"] },
  { phrase = "benign neoplasm of ascending colon", codes = ["D12.2"] },
  { phrase = "carcinoma in situ of cervix", codes = ["D06.9"] },
]

[[group]]
