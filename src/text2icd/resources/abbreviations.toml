# Clinical abbreviations of diagnosis phrases and their expansions.
#
# Written from medical knowledge. Never copy an entry from restricted data: the local mining tool
# (`text2icd eval mimic abbrev mine`) only shows which abbreviations are frequent, and the
# expansion is then written here by hand.
#
# An entry is `KEY = "expansion"`, or a table:
#
#   expansions = ["...", "..."]   more than one meaning: the abbreviation is ambiguous, and the
#                                 first expansion is the default when no hint applies
#   hints."<expansion>" = [...]   words of the phrase that select that expansion
#   cased = true                  match only when written in capitals, because the lower-case
#                                 form is an English word (ALL, AS, CAP) or a unit (MM)
#
# Matching ignores case, and spaces, hyphens, dots and slashes inside a key are optional: "A-fib"
# matches "afib", "a fib" and "A-Fib". An "s" after a key written in capitals is a plural ("PEs").
# A key never matches inside a word, before "-" and a digit ("COVID-19"), or in a phrase written
# all in capitals for cased entries. Single-letter keys need a space after them ("R hip").
#
# Expansions use the wording of the Alphabetic Index where it has one (check with
# `text2icd graph show`), and every word of an expansion is a word of the CMS files (a slow test
# checks this, apart from procedure words, which the diagnosis files lack). Abbreviations that are
# Index main terms themselves (AIDS, BRBPR, GERD, STEMI, TBI) have no entry: the Index finds them.

schema = 1

