# LLM prices used to account the cost of every call, in US dollars per million tokens.
# Costs are computed from each response's usage fields (input, output, cache read, cache write)
# times these prices, so a wrong price here gives a wrong cost per 1,000 phrases. Re-check the
# provider's price page before reporting costs, and record the date below when you do.
#
# input / output         : uncached prompt tokens and generated tokens
# cache_read             : prompt tokens read from the prompt cache
# cache_write_5m / _1h   : prompt tokens written to the cache with a 5-minute or 1-hour lifetime
# long_context_above     : prompts with more tokens than this are billed at long_input/long_output,
#                          and their cache prices scale by the same factor
# batch_discount         : the share of the price paid when sent through a batch interface

schema = 1
checked = 2026-11-01

[[model]]
provider = "anthropic"
id = "claude-haiku-5-5"
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20
long_context_above = 100_000
long_input = 0.50
long_output = 2.50
batch_discount = 0.5

