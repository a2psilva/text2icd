name: Data release

# Builds one release's graph and vectors from the CMS files, checks them, and packages them
# (task 10.5). With `publish`, it attaches them to a GitHub Release `data-<release>-s<schema>`
# and opens a PR adding them to src/text2icd/resources/graphs.toml, from which `text2icd setup`
# and `text2icd data fetch-graph` download them. Without it, the files are a workflow artifact
# only. CMS files are US public domain; no MIMIC-IV data is involved.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release id, such as fy2027"
        required: true
      publish:
        description: "Create the GitHub Release and open the graphs.toml PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-release-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}  # read from the environment, never pasted into a script
      TEXT2ICD_DATA_DIR: data
    steps:
      - name: Check the release id
        run: |
          if [[ ! "$RELEASE" =~ ^fy[0-9]{4}(-apr)?$ ]]; then
            echo "::error::release must look like fy2027 or fy2027-apr"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Fetch the CMS files (verified against releases.toml)
        run: uv run text2icd data fetch -r "$RELEASE"
      - name: Build and check the graph
        run: |
          uv run text2icd build-graph -r "$RELEASE"
          uv run text2icd graph check -r "$RELEASE"
      - name: Embed its texts for L2
        run: uv run text2icd graph embed -r "$RELEASE"
      - name: Check the coder against the committed sample's bounds
        # The sample is written for FY2027; other releases are checked by the integrity checks.
        if: inputs.release == 'fy2027'
        run: |
          out=data/processed/eval/release
          uv run text2icd eval run -d cms-synthetic-sample -s coder --split all -r "$RELEASE" \
            -o "$out/coder.jsonl"
          uv run text2icd eval run -d cms-synthetic-sample -s coder -O retrieval=on --split all \
            -r "$RELEASE" -o "$out/coder-l2.jsonl"
          uv run text2icd eval check "$out"/*.jsonl \
            -e benchmarks/cms-synthetic/fy2027-sample.expected.toml
      - name: Package
        run: |
          uv run text2icd data package -r "$RELEASE" -o dist \
            --registry src/text2icd/resources/graphs.toml
          cp src/text2icd/resources/graphs.toml dist/graphs.toml
      - uses: actions/upload-artifact@v7
        with:
          name: data-${{ inputs.release }}
          path: dist/
          retention-days: 7

  publish:
    name: Publish the GitHub Release and open the graphs.toml PR
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the release and the PR's branch
      pull-requests: write
    env:
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: data-${{ inputs.release }}
          path: dist
      - name: Create the release
        run: |
          tag=$(python3 -c "import tomllib, os; print(tomllib.load(open('dist/' + os.environ['RELEASE'] + '.toml', 'rb'))[os.environ['RELEASE']]['tag'])")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          {
            echo "The text2icd knowledge graph of $RELEASE and its L2 vectors, built from the CMS ICD-10-CM files (US public domain) by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at $GITHUB_SHA."
            echo
            echo "Install with \`text2icd setup\` or \`text2icd data fetch-graph -r $RELEASE\`, which check each file's SHA-256 below and the graph's content hash."
            echo
            echo '```toml'
            cat "dist/$RELEASE.toml"
            echo '```'
          } > notes.md
          gh release create "$tag" dist/*.xz dist/*.gz --target "$GITHUB_SHA" \
            --title "Data: $RELEASE ($tag)" --notes-file notes.md
      - name: Open the graphs.toml PR
        run: |
          branch="data/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          cp dist/graphs.toml src/text2icd/resources/graphs.toml
          git add src/text2icd/resources/graphs.toml
          git commit -m "data: publish $RELEASE ($TAG)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "data: publish $RELEASE ($TAG)" \
            --body "Adds the $TAG data release to graphs.toml, so that \`text2icd setup\` downloads it. CI does not run on PRs opened by this workflow's token: close and reopen the PR to run it."
