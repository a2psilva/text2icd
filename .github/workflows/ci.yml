name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: Restricted data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if anything under data/ or notebooks/local/ is tracked
        run: |
          tracked=$(git ls-files data notebooks/local | grep -Ev '(^|/)(README\.md|\.gitkeep)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Restricted files are tracked (see docs/data-and-compliance.md):"
            echo "$tracked"
            exit 1
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  integration:
    name: Integration (CMS releases)
    # Not a required check: it downloads the CMS files, which can be slow or unavailable. It runs
    # the slow tests on the real releases, then builds each graph and runs its integrity checks.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Restore the CMS release files
        uses: actions/cache@v6
        with:
          path: data/raw/cms
          # Bump the prefix when the set of fetched releases changes, so the cache is saved again.
          key: cms-v2-${{ hashFiles('src/text2icd/resources/releases.toml') }}
      - name: Fetch FY2026, FY2027 and the FY2016-FY2025 code lists (verified against releases.toml)
        run: uv run text2icd data fetch -r fy2026 -r fy2027 --history
      - name: Slow tests on the CMS files
        run: uv run pytest -m "slow and not benchmark"
      - name: Build and check the graphs
        run: |
          for release in fy2026 fy2027; do
            uv run text2icd build-graph -r "$release"
            uv run text2icd graph check -r "$release"
          done
      - name: Evaluate the BM25 baseline on the committed cms-synthetic sample
        run: |
          uv run text2icd eval validate benchmarks/cms-synthetic/fy2027-sample.jsonl
          uv run text2icd eval run -d cms-synthetic-sample -s bm25 --split all -r fy2027
