name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: Restricted data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if anything under data/ or notebooks/local/ is tracked
        run: |
          tracked=$(git ls-files data notebooks/local | grep -Ev '(^|/)(README\.md|\.gitkeep)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Restricted files are tracked (see docs/data-and-compliance.md):"
            echo "$tracked"
            exit 1
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing
