name: Docker

# The image (task 10.4): the service and UI, with FY2027's graph, L2's vectors and the model baked
# in. On a pull request that changes it, or by hand: builds it for linux/amd64 and tests it with
# no network. On a version tag: also builds it for linux/arm64 and pushes both to
# ghcr.io/a2psilva/text2icd, tagged with the version, MAJOR.MINOR and latest (a pre-release gets
# its version only), with build provenance. The image holds CMS data only (US public domain).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .github/workflows/docker.yml
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/a2psilva/text2icd

jobs:
  image:
    name: Build, test and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # tags only
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: text2icd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Code a phrase with no network (L1 and L2 from the image)
        run: |
          docker run --rm --network none text2icd:test \
            code "type 2 DM with diabetic CKD stage 3a" --json > result.json
          python3 - <<'EOF'
          import json
          result = json.load(open("result.json"))
          codes = [c["code"] for c in result["codes"]]
          assert codes == ["E11.22", "N18.31"], codes
          EOF
          docker run --rm --network none text2icd:test data where
      - name: Serve with a read-only file system
        run: |
          docker run -d --name text2icd --read-only --tmpfs /tmp -p 127.0.0.1:8000:8000 text2icd:test
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -sf -X POST http://127.0.0.1:8000/v1/code -H "content-type: application/json" \
            -d '{"phrase": "aspiration pneumonia due to food"}' > served.json
          python3 -c "import json; assert json.load(open('served.json'))['codes'][0]['code'] == 'J69.0'"
          curl -sf http://127.0.0.1:8000/version
          curl -sf http://127.0.0.1:8000/ | grep -q '<script type="module" src="app.js">'
          test "$(docker inspect -f '{{.Config.User}}' text2icd:test)" = text2icd
      - name: Logs
        if: always()
        run: docker logs text2icd || true
      - name: Image size
        run: |
          docker image inspect text2icd:test --format '{{.Size}}' \
            | awk '{printf "Image size (linux/amd64, uncompressed): %.0f MB\n", $1 / 1e6}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v4
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: github.ref_type == 'tag'
        id: push
        name: Build for linux/amd64 and linux/arm64, and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
