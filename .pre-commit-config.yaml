repos:
  - repo: local
    hooks:
      - id: forbid-restricted-data
        name: forbid files under data/ and notebooks/local/ (MIMIC-IV must never be committed)
        language: fail
        entry: "Restricted path. Only README.md and .gitkeep may be committed under data/; notebooks/local/ is private. See docs/data-and-compliance.md."
        files: ^(data/|notebooks/local/)
        exclude: ^data/(.+/)?(README\.md|\.gitkeep)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
