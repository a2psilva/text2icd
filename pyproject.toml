[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "text2icd"
version = "0.1.0"
description = "Map clinical diagnosis phrases to ICD-10-CM codes by navigating the CMS Alphabetic Index and Tabular List the way a medical coder does."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a2psilva" }]
requires-python = ">=3.11"
keywords = ["icd-10-cm", "medical-coding", "clinical-nlp", "knowledge-graph", "entity-linking", "healthcare"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    "typer>=0.12",
    "numpy>=2.1",
    "platformdirs>=4.0",
    "rapidfuzz>=3.10",
]

[project.scripts]
text2icd = "text2icd.cli:app"

[project.urls]
Homepage = "https://github.com/a2psilva/text2icd"
Issues = "https://github.com/a2psilva/text2icd/issues"
Changelog = "https://github.com/a2psilva/text2icd/blob/main/CHANGELOG.md"

# Install from GitHub, not PyPI (see text2icd/extras.py):
#   uv tool install "text2icd[all] @ git+https://github.com/a2psilva/text2icd"
[project.optional-dependencies]
# L2, local retrieval: the ONNX encoder, its tokenizer, and the Hub client that downloads them.
embeddings = [
    "huggingface_hub>=0.30",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]
llm = [
    "anthropic>=2.3",
]
# The same LLM navigator on Amazon Bedrock (boto3 for AWS credentials) or Google Cloud Vertex AI
# (google-auth for Application Default Credentials).
bedrock = [
    "anthropic[bedrock]>=2.3",
]
vertex = [
    "anthropic[vertex]>=2.3",
]
# The evaluation: the static-embedding baseline (B2) and the MIMIC-IV aligner (model2vec), and
# fitting the confidence calibration (`text2icd eval calibrate`). The coder needs none of it.
eval = [
    "model2vec>=0.10",
    "scikit-learn>=1.5",
]
# The HTTP service and its web UI (`text2icd serve`).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# What the coder can use: L2, L3 on the Anthropic API, and the service.
all = [
    "text2icd[api,embeddings,llm]",
]

[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI's TestClient
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Browser checks of the UI (tests/api/test_ui_browser.py), not installed by default:
#   uv sync --group ui && uv run playwright install chromium
ui = [
    "playwright>=1.48",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/text2icd"]

[tool.hatch.build.targets.sdist]
include = ["src/text2icd", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "notebooks/local"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["text2icd"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# onnxruntime ships no type information.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no type information.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "mimic: needs local MIMIC-IV files under data/raw/mimic-iv (skipped when absent, never runs in CI)",
    "slow: long-running test (graph builds, full benchmarks)",
    "benchmark: a time or memory budget; run locally, since shared CI runners vary too much",
]

[tool.coverage.run]
source = ["text2icd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
