[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "text2icd"
version = "0.0.1"
description = "Map clinical diagnosis phrases to ICD-10-CM codes by navigating the CMS Alphabetic Index and Tabular List the way a medical coder does."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a2psilva" }]
requires-python = ">=3.11"
keywords = ["icd-10-cm", "medical-coding", "clinical-nlp", "knowledge-graph", "entity-linking", "healthcare"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = ["typer>=0.12"]

[project.scripts]
text2icd = "text2icd.cli:app"

[project.urls]
Homepage = "https://github.com/a2psilva/text2icd"
Issues = "https://github.com/a2psilva/text2icd/issues"
Changelog = "https://github.com/a2psilva/text2icd/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text2icd"]

[tool.hatch.build.targets.sdist]
include = ["src/text2icd", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "notebooks/local"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["text2icd"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "mimic: needs local MIMIC-IV files under data/raw/mimic-iv (skipped when absent, never runs in CI)",
    "slow: long-running test (graph builds, full benchmarks)",
]

[tool.coverage.run]
source = ["text2icd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
